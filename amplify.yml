version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'max-age=0'
  rewritesAndRedirects:
    - source: /admissions/<*>
      target: https://dev.dnm1ne8he5zup.amplifyapp.com/
      status: 200
    - source: /reports/<*>
      target: https://reports.your-app.amplifyapp.com/<*>
      status: 200
    - source: /<*>
      target: /index.html
      status: 200
